plugins { id 'com.android.application' }
android {
    namespace 'dev.boundarylab.browser'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId providers.gradleProperty('shellApplicationId').getOrElse('dev.boundarylab.browser')
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('shellVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('shellVersionName').getOrElse('1.0')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
